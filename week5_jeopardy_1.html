<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marketing Mix & Competitive Strategy Jeopardy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --ink:#0B1F3D;
    --ink-2:#12294f;
    --paper:#F6F4EE;
    --gold:#D4AF37;
    --gold-dim:#a9872c;
    --teal:#2EC4B6;
    --coral:#FF6B6B;
    --grid-line: rgba(212,175,55,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      radial-gradient(ellipse at top, var(--ink-2), var(--ink) 70%);
    font-family: 'Trebuchet MS', 'Segoe UI', Helvetica, Arial, sans-serif;
    color: var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
  }
  header{
    text-align:center;
    margin-bottom: 22px;
  }
  .eyebrow{
    letter-spacing: 4px;
    font-size: 12px;
    color: var(--teal);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(26px, 4.6vw, 44px);
    margin: 0;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    letter-spacing: 1px;
  }
  .subtitle{
    margin-top: 8px;
    font-size: 14px;
    color: rgba(246,244,238,0.65);
  }

  .scoreboard{
    display:flex;
    gap:14px;
    align-items:center;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 999px;
    padding: 10px 22px;
    margin-bottom: 26px;
    font-variant-numeric: tabular-nums;
  }
  .scoreboard .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    color: rgba(246,244,238,0.6);
  }
  .scoreboard .value{
    font-size: 26px;
    font-weight:700;
    color: var(--gold);
    min-width: 70px;
    text-align:center;
  }
  .scoreboard.negative .value{ color: var(--coral); }

  .board{
    width: 100%;
    max-width: 1200px;
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    background: rgba(0,0,0,0.2);
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.25);
  }
  .cat-header{
    background: linear-gradient(180deg, #0f2a52, #0a1c3a);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 6px;
    padding: 14px 8px;
    text-align:center;
    font-weight:700;
    font-size: clamp(11px, 1.3vw, 14px);
    text-transform:uppercase;
    letter-spacing: 0.5px;
    color: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 68px;
    line-height:1.25;
  }
  .cell{
    background: linear-gradient(180deg, #123063, #0b1f3f);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 6px;
    padding: 18px 6px;
    text-align:center;
    font-family: Georgia, serif;
    font-weight:700;
    font-size: clamp(18px, 2.6vw, 26px);
    color: var(--gold);
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
    user-select:none;
  }
  .cell:hover:not(.used){
    transform: translateY(-2px);
    background: linear-gradient(180deg, #16407f, #0d234a);
  }
  .cell.used{
    color: rgba(212,175,55,0.22);
    cursor: default;
    background: rgba(0,0,0,0.25);
  }
  .cell.used::after{
    content: "✓";
    display:block;
    font-size: 14px;
    margin-top: 4px;
    color: rgba(46,196,182,0.4);
  }

  footer{
    margin-top: 34px;
    font-size: 12px;
    color: rgba(246,244,238,0.4);
    text-align:center;
  }

  /* Modal */
  .overlay{
    position: fixed; inset:0;
    background: rgba(4,10,22,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: linear-gradient(180deg, #123063, #0a1c3a);
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 12px;
    max-width: 720px;
    width:100%;
    padding: 34px 30px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align:center;
  }
  .modal .tag{
    color: var(--teal);
    font-size: 12px;
    text-transform:uppercase;
    letter-spacing:3px;
    font-weight:700;
    margin-bottom: 10px;
  }
  .modal .value-tag{
    color: var(--gold);
    font-size:14px;
    font-weight:700;
    margin-bottom: 18px;
  }
  .modal .question{
    font-family: Georgia, serif;
    font-size: clamp(18px, 2.6vw, 24px);
    line-height:1.45;
    margin-bottom: 26px;
    color: var(--paper);
  }
  .choices{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width:520px){ .choices{ grid-template-columns: 1fr; } }
  .choice{
    background: rgba(246,244,238,0.06);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 8px;
    padding: 14px 12px;
    color: var(--paper);
    font-size: 15px;
    text-align:left;
    cursor:pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .choice:hover:not(.locked){
    background: rgba(212,175,55,0.14);
    border-color: var(--gold);
  }
  .choice .letter{
    display:inline-block;
    width: 22px;
    height:22px;
    line-height:22px;
    border-radius:50%;
    background: rgba(212,175,55,0.25);
    color: var(--gold);
    font-weight:700;
    font-size: 12px;
    margin-right: 10px;
    text-align:center;
  }
  .choice.correct{
    background: rgba(46,196,182,0.22);
    border-color: var(--teal);
  }
  .choice.wrong{
    background: rgba(255,107,107,0.2);
    border-color: var(--coral);
  }
  .feedback{
    min-height: 22px;
    font-weight:700;
    margin-bottom: 14px;
  }
  .feedback.correct-text{ color: var(--teal); }
  .feedback.wrong-text{ color: var(--coral); }

  .close-btn{
    background: var(--gold);
    color: var(--ink);
    border:none;
    padding: 10px 26px;
    border-radius: 999px;
    font-weight:700;
    cursor:pointer;
    font-size:14px;
    letter-spacing: 0.5px;
  }
  .close-btn:hover{ background:#e8c765; }
  .close-btn:disabled{
    opacity: 0.35;
    cursor: not-allowed;
  }

  .reset-btn{
    margin-top: 4px;
    background: transparent;
    color: rgba(246,244,238,0.55);
    border: 1px solid rgba(246,244,238,0.25);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 12px;
    cursor:pointer;
  }
  .reset-btn:hover{
    color: var(--paper);
    border-color: var(--gold);
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Week 5 · Marketing Mix & Competitive Marketing Strategies</div>
  <h1>Marketing Mix Jeopardy</h1>
  <div class="subtitle">Products &amp; brands, pricing, channel management, value chain, and competitive intelligence</div>
</header>

<div class="scoreboard" id="scoreboard">
  <span class="label">Score</span>
  <span class="value" id="scoreValue">$0</span>
  <button class="reset-btn" id="resetBtn">Reset Game</button>
</div>

<div class="board" id="board"></div>

<footer>Click a dollar value to open the clue. Answers are locked in once selected.</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="tag" id="modalCat">Category</div>
    <div class="value-tag" id="modalValue">$100</div>
    <div class="question" id="modalQuestion">Question text</div>
    <div class="choices" id="modalChoices"></div>
    <div class="feedback" id="modalFeedback"></div>
    <button class="close-btn" id="closeBtn" disabled>Close</button>
  </div>
</div>

<script>
const DATA = [
  {
    category: "Products & Brand Management",
    questions: [
      { value:100, q:"A product line refers to:",
        options:["A group of related products marketed under one brand that function similarly or are sold to similar customer groups","A single unique item with no variations","The physical location where products are stored","A company's annual financial report"], correct:0 },
      { value:200, q:"Brand equity refers to:",
        options:["The legal cost of registering a trademark","The added value a brand name gives to a product beyond its functional benefits","The retail price of a product","The number of employees working on a brand"], correct:1 },
      { value:300, q:"Which of the following is the core benefit level of a product?",
        options:["The brand name printed on the package","The warranty offered with the product","The basic problem-solving service or benefit the customer is actually buying","The delivery packaging design"], correct:2 },
      { value:400, q:"Brand loyalty is best defined as:",
        options:["A one-time purchase by a new customer","A company's advertising budget","The legal protection of a brand name","A consumer's consistent preference for and repeat purchase of a particular brand"], correct:3 },
      { value:500, q:"Line extension refers to:",
        options:["Introducing additional items in the same product category under the same brand name, such as new flavors or sizes","Launching an entirely new brand in an unrelated category","Discontinuing a product line completely","Merging with a competitor's brand"], correct:0 }
    ]
  },
  {
    category: "Pricing Strategy",
    questions: [
      { value:100, q:"Price skimming is a strategy of:",
        options:["Setting the lowest possible price to enter a market quickly","Setting a high initial price for a new product to maximize revenue from segments willing to pay more, then lowering it over time","Matching competitor prices exactly at all times","Giving products away for free"], correct:1 },
      { value:200, q:"Penetration pricing involves:",
        options:["Charging the highest price the market will bear","Changing prices randomly to confuse competitors","Setting a low initial price to attract many buyers and gain market share quickly","Pricing based solely on production cost plus a fixed margin"], correct:2 },
      { value:300, q:"Value-based pricing sets prices primarily based on:",
        options:["The lowest competitor's price","The cost of raw materials only","Government-mandated price ceilings","Buyers' perceptions of a product's value rather than the seller's cost alone"], correct:3 },
      { value:400, q:"Cost-based pricing determines price by:",
        options:["Adding a standard markup to the cost of producing and distributing the product","Surveying only what competitors charge","Ignoring cost entirely","Setting price equal to the average customer's income"], correct:0 },
      { value:500, q:"Psychological pricing (e.g., pricing an item at $9.99 instead of $10.00) is designed to:",
        options:["Reduce a company's tax liability","Influence consumer perception of value and encourage purchase","Comply with a legal pricing requirement","Standardize prices across all retailers"], correct:1 }
    ]
  },
  {
    category: "Channel Management",
    questions: [
      { value:100, q:"A marketing channel (distribution channel) is:",
        options:["The internal accounting system of a firm","A single advertisement placed online","A set of interdependent organizations that help make a product available to the end user","A company's customer service hotline"], correct:2 },
      { value:200, q:"Channel conflict occurs when:",
        options:["Two companies form a joint venture","A company launches a new product","Customers switch to a competitor's brand","Channel members disagree over roles, goals, or compensation within the distribution channel"], correct:3 },
      { value:300, q:"Direct marketing channels involve:",
        options:["Selling a product directly to the final customer without intermediaries","Always using at least three intermediaries","Selling only through wholesalers","Selling exclusively through retail chains"], correct:0 },
      { value:400, q:"An intensive distribution strategy aims to:",
        options:["Sell a product through only one exclusive retailer","Stock a product in as many outlets as possible for maximum market coverage","Avoid all retail partnerships","Limit sales to a single geographic region"], correct:1 },
      { value:500, q:"Exclusive distribution involves:",
        options:["Selling a product through every available outlet","Selling through hundreds of unrelated retailers","Giving a limited number of dealers the exclusive right to distribute a product in their territory","Selling only through the manufacturer's website"], correct:2 }
    ]
  },
  {
    category: "Value Chain & External Audit",
    questions: [
      { value:100, q:"The value chain is a framework used to:",
        options:["Calculate a company's stock price","Track employee attendance","Set advertising budgets only","Identify the activities a firm performs to create value and examine each for potential competitive advantage"], correct:3 },
      { value:200, q:"Value chain analysis helps a company:",
        options:["Identify which internal activities add the most value and where costs can be reduced or advantages gained","Determine employee vacation schedules","Set the corporate tax rate","Choose the company's logo colors"], correct:0 },
      { value:300, q:"Outsourcing refers to:",
        options:["Hiring only internal employees for every business function","Contracting an outside company to perform an activity that was previously handled in-house","Closing a company's foreign offices","Merging with a direct competitor"], correct:1 },
      { value:400, q:"An external audit in strategic planning examines:",
        options:["Only the company's internal financial statements","Employee satisfaction levels exclusively","Outside factors such as the economy, competitors, and industry trends that affect the company","The company's internal org chart only"], correct:2 },
      { value:500, q:"Environmental scanning involves:",
        options:["Reviewing only past sales data","Ignoring competitor activity","Auditing internal financial records","Continuously monitoring the external environment to identify trends, opportunities, and threats"], correct:3 }
    ]
  },
  {
    category: "Competitive Analysis & Ethical Intelligence",
    questions: [
      { value:100, q:"A competitive analysis framework typically evaluates:",
        options:["Competitors' strengths, weaknesses, strategies, and likely reactions to market changes","Only a company's own advertising spend","Employee performance reviews","Manufacturing equipment maintenance schedules"], correct:0 },
      { value:200, q:"Forecasting in the external audit process is used to:",
        options:["Record historical accounting entries only","Predict future trends and conditions that may affect the company's strategy","Set employee salaries","Design product packaging"], correct:1 },
      { value:300, q:"Assessing, in the context of environmental analysis, involves:",
        options:["Ignoring identified trends","Copying a competitor's product exactly","Determining the timing and importance of environmental trends and events for company strategy","Filing a company's tax return"], correct:2 },
      { value:400, q:"Ethical competitive intelligence gathering relies on:",
        options:["Corporate espionage and hacking competitor systems","Bribing competitor employees for internal documents","Misrepresenting one's identity to obtain confidential information","Publicly available and legally obtained information, such as press releases, filings, and industry reports"], correct:3 },
      { value:500, q:"A well-known case frequently studied for competitive dynamics and brand strategy is the rivalry involving:",
        options:["PepsiCo and its major cola competitor","Two unrelated non-competing local bakeries","A single monopoly with no competitors","Companies in entirely different industries with no market overlap"], correct:0 }
    ]
  }
];

let score = 0;
const usedSet = new Set();
let currentKey = null;

function rebuildGrid(){
  const board = document.getElementById('board');
  board.style.gridTemplateRows = 'auto repeat(5, 1fr)';
  board.innerHTML = '';
  DATA.forEach((cat)=>{
    const header = document.createElement('div');
    header.className = 'cat-header';
    header.textContent = cat.category;
    board.appendChild(header);
  });
  for(let row=0; row<5; row++){
    DATA.forEach((cat, ci)=>{
      const q = cat.questions[row];
      const key = ci + '-' + row;
      const cell = document.createElement('div');
      cell.className = 'cell' + (usedSet.has(key) ? ' used' : '');
      cell.textContent = '$' + q.value;
      if(!usedSet.has(key)){
        cell.addEventListener('click', () => openModal(ci, row));
      }
      board.appendChild(cell);
    });
  }
  document.getElementById('scoreValue').textContent = (score < 0 ? '-$' + Math.abs(score) : '$' + score);
  document.getElementById('scoreboard').classList.toggle('negative', score < 0);
}

function openModal(ci, qi){
  const cat = DATA[ci];
  const q = cat.questions[qi];
  currentKey = ci + '-' + qi;

  document.getElementById('modalCat').textContent = cat.category;
  document.getElementById('modalValue').textContent = '$' + q.value;
  document.getElementById('modalQuestion').textContent = q.q;
  document.getElementById('modalFeedback').textContent = '';
  document.getElementById('modalFeedback').className = 'feedback';
  document.getElementById('closeBtn').disabled = true;

  const choicesEl = document.getElementById('modalChoices');
  choicesEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.innerHTML = '<span class="letter">' + letters[idx] + '</span>' + opt;
    div.addEventListener('click', () => selectAnswer(idx, q, div, choicesEl));
    choicesEl.appendChild(div);
  });

  document.getElementById('overlay').classList.add('open');
}

function selectAnswer(idx, q, el, container){
  Array.from(container.children).forEach(c => c.classList.add('locked'));
  const feedback = document.getElementById('modalFeedback');

  if(idx === q.correct){
    el.classList.add('correct');
    score += q.value;
    feedback.textContent = 'Correct! +$' + q.value;
    feedback.className = 'feedback correct-text';
  } else {
    el.classList.add('wrong');
    Array.from(container.children)[q.correct].classList.add('correct');
    score -= q.value;
    feedback.textContent = 'Not quite. -$' + q.value;
    feedback.className = 'feedback wrong-text';
  }
  usedSet.add(currentKey);
  document.getElementById('closeBtn').disabled = false;
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
  rebuildGrid();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  score = 0;
  usedSet.clear();
  rebuildGrid();
});

rebuildGrid();
</script>

</body>
</html>
