<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marketing Research Jeopardy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --ink:#0B1F3D;
    --ink-2:#12294f;
    --paper:#F6F4EE;
    --gold:#D4AF37;
    --gold-dim:#a9872c;
    --teal:#2EC4B6;
    --coral:#FF6B6B;
    --grid-line: rgba(212,175,55,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      radial-gradient(ellipse at top, var(--ink-2), var(--ink) 70%);
    font-family: 'Trebuchet MS', 'Segoe UI', Helvetica, Arial, sans-serif;
    color: var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
  }
  header{
    text-align:center;
    margin-bottom: 22px;
  }
  .eyebrow{
    letter-spacing: 4px;
    font-size: 12px;
    color: var(--teal);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(28px, 5vw, 46px);
    margin: 0;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    letter-spacing: 1px;
  }
  .subtitle{
    margin-top: 8px;
    font-size: 14px;
    color: rgba(246,244,238,0.65);
  }

  .scoreboard{
    display:flex;
    gap:14px;
    align-items:center;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 999px;
    padding: 10px 22px;
    margin-bottom: 26px;
    font-variant-numeric: tabular-nums;
  }
  .scoreboard .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    color: rgba(246,244,238,0.6);
  }
  .scoreboard .value{
    font-size: 26px;
    font-weight:700;
    color: var(--gold);
    min-width: 70px;
    text-align:center;
  }
  .scoreboard.negative .value{ color: var(--coral); }

  .board{
    width: 100%;
    max-width: 1200px;
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    background: rgba(0,0,0,0.2);
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.25);
  }
  .cat-header{
    background: linear-gradient(180deg, #0f2a52, #0a1c3a);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 6px;
    padding: 14px 8px;
    text-align:center;
    font-weight:700;
    font-size: clamp(11px, 1.4vw, 14px);
    text-transform:uppercase;
    letter-spacing: 0.5px;
    color: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 64px;
    line-height:1.25;
  }
  .cell{
    background: linear-gradient(180deg, #123063, #0b1f3f);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 6px;
    padding: 18px 6px;
    text-align:center;
    font-family: Georgia, serif;
    font-weight:700;
    font-size: clamp(18px, 2.6vw, 26px);
    color: var(--gold);
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
    user-select:none;
  }
  .cell:hover:not(.used){
    transform: translateY(-2px);
    background: linear-gradient(180deg, #16407f, #0d234a);
  }
  .cell.used{
    color: rgba(212,175,55,0.22);
    cursor: default;
    background: rgba(0,0,0,0.25);
  }
  .cell.used::after{
    content: "✓";
    display:block;
    font-size: 14px;
    margin-top: 4px;
    color: rgba(46,196,182,0.4);
  }

  footer{
    margin-top: 34px;
    font-size: 12px;
    color: rgba(246,244,238,0.4);
    text-align:center;
  }

  /* Modal */
  .overlay{
    position: fixed; inset:0;
    background: rgba(4,10,22,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: linear-gradient(180deg, #123063, #0a1c3a);
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 12px;
    max-width: 720px;
    width:100%;
    padding: 34px 30px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align:center;
  }
  .modal .tag{
    color: var(--teal);
    font-size: 12px;
    text-transform:uppercase;
    letter-spacing:3px;
    font-weight:700;
    margin-bottom: 10px;
  }
  .modal .value-tag{
    color: var(--gold);
    font-size:14px;
    font-weight:700;
    margin-bottom: 18px;
  }
  .modal .question{
    font-family: Georgia, serif;
    font-size: clamp(18px, 2.6vw, 24px);
    line-height:1.45;
    margin-bottom: 26px;
    color: var(--paper);
  }
  .choices{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width:520px){ .choices{ grid-template-columns: 1fr; } }
  .choice{
    background: rgba(246,244,238,0.06);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 8px;
    padding: 14px 12px;
    color: var(--paper);
    font-size: 15px;
    text-align:left;
    cursor:pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .choice:hover:not(.locked){
    background: rgba(212,175,55,0.14);
    border-color: var(--gold);
  }
  .choice .letter{
    display:inline-block;
    width: 22px;
    height:22px;
    line-height:22px;
    border-radius:50%;
    background: rgba(212,175,55,0.25);
    color: var(--gold);
    font-weight:700;
    font-size: 12px;
    margin-right: 10px;
    text-align:center;
  }
  .choice.correct{
    background: rgba(46,196,182,0.22);
    border-color: var(--teal);
  }
  .choice.wrong{
    background: rgba(255,107,107,0.2);
    border-color: var(--coral);
  }
  .feedback{
    min-height: 22px;
    font-weight:700;
    margin-bottom: 14px;
  }
  .feedback.correct-text{ color: var(--teal); }
  .feedback.wrong-text{ color: var(--coral); }

  .close-btn{
    background: var(--gold);
    color: var(--ink);
    border:none;
    padding: 10px 26px;
    border-radius: 999px;
    font-weight:700;
    cursor:pointer;
    font-size:14px;
    letter-spacing: 0.5px;
  }
  .close-btn:hover{ background:#e8c765; }
  .close-btn:disabled{
    opacity: 0.35;
    cursor: not-allowed;
  }

  .reset-btn{
    margin-top: 4px;
    background: transparent;
    color: rgba(246,244,238,0.55);
    border: 1px solid rgba(246,244,238,0.25);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 12px;
    cursor:pointer;
  }
  .reset-btn:hover{
    color: var(--paper);
    border-color: var(--gold);
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Week 3 · Marketing Research &amp; Digital Metrics</div>
  <h1>Marketing Research Jeopardy</h1>
  <div class="subtitle">Test your knowledge across research process, sampling, digital metrics &amp; competitive intelligence</div>
</header>

<div class="scoreboard" id="scoreboard">
  <span class="label">Score</span>
  <span class="value" id="scoreValue">$0</span>
  <button class="reset-btn" id="resetBtn">Reset Game</button>
</div>

<div class="board" id="board"></div>

<footer>Click a dollar value to open the clue. Answers are locked in once selected.</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="tag" id="modalCat">Category</div>
    <div class="value-tag" id="modalValue">$100</div>
    <div class="question" id="modalQuestion">Question text</div>
    <div class="choices" id="modalChoices"></div>
    <div class="feedback" id="modalFeedback"></div>
    <button class="close-btn" id="closeBtn" disabled>Close</button>
  </div>
</div>

<script>
const DATA = [
  {
    category: "Market Research Basics",
    questions: [
      { value:100, q:"What is the primary purpose of marketing research?",
        options:["To provide information that helps identify and solve marketing problems","To increase advertising budget","To reduce employee turnover","To set company stock prices"], correct:0 },
      { value:200, q:"A marketing information system (MIS) is best described as:",
        options:["A system solely for accounting data","People, procedures, and technology used to gather, sort, analyze, and distribute needed, timely information to decision makers","A social media scheduling tool","A customer complaint database"], correct:1 },
      { value:300, q:"'Constructing information' in marketing research refers to:",
        options:["Deleting outdated records","Copying competitor reports","Transforming raw data into a usable format for decision-making","Creating advertisements"], correct:2 },
      { value:400, q:"Which term describes the systematic gathering, recording, and analyzing of data about problems in marketing goods and services?",
        options:["Financial auditing","Product engineering","Public relations","Marketing research"], correct:3 },
      { value:500, q:"Marketing intelligence differs from marketing research in that it:",
        options:["Involves continuous monitoring of the everyday marketing environment for information","Only uses paid surveys","Is illegal in most countries","Focuses exclusively on internal sales data"], correct:0 }
    ]
  },
  {
    category: "The Research Process",
    questions: [
      { value:100, q:"The first step in the marketing research process is:",
        options:["Collecting the data","Defining the problem and research objectives","Presenting the report","Choosing a sample size"], correct:1 },
      { value:200, q:"A research objective that seeks to describe something, like market potential, is called:",
        options:["Exploratory research","Causal research","Descriptive research","Secondary research"], correct:2 },
      { value:300, q:"Research designed to test a hypothesis about a cause-and-effect relationship is:",
        options:["Exploratory","Descriptive","Ethnographic","Causal"], correct:3 },
      { value:400, q:"Which of the following best represents the 'research plan' step?",
        options:["Deciding what specific information is needed and how to collect it efficiently","Publishing final findings","Hiring a marketing manager","Setting the product price"], correct:0 },
      { value:500, q:"After data is collected, the next step in the process is to:",
        options:["Immediately discard raw data","Analyze the data to pull out findings","Restart the entire study","Skip straight to implementation"], correct:1 }
    ]
  },
  {
    category: "Sampling & Methods",
    questions: [
      { value:100, q:"Secondary data refers to information that:",
        options:["Is collected specifically for the current research purpose","Cannot be used in marketing research","Already exists somewhere, having been collected for another purpose","Is always more accurate than primary data"], correct:2 },
      { value:200, q:"Primary data is:",
        options:["Data purchased from a syndicated service only","Historical government statistics","Never used in exploratory research","Information collected for the specific purpose at hand"], correct:3 },
      { value:300, q:"A sample in which every member of the population has a known, equal chance of selection is called a:",
        options:["Probability sample","Convenience sample","Judgment sample","Quota sample"], correct:0 },
      { value:400, q:"Which method of contact involves interacting with respondents face-to-face?",
        options:["Mail survey","Personal interview","Online panel","Automated phone survey"], correct:1 },
      { value:500, q:"Deciding 'who is to be surveyed' and 'how many people should be surveyed' are both part of:",
        options:["Data analysis","Report writing","Planning the sample","Setting the research budget"], correct:2 }
    ]
  },
  {
    category: "Digital Marketing Metrics",
    questions: [
      { value:100, q:"Click-through rate (CTR) measures:",
        options:["Total revenue from a campaign","The number of employees","Product return rate","The percentage of people who click a link after seeing an ad or content"], correct:3 },
      { value:200, q:"Conversion rate refers to:",
        options:["The percentage of visitors who complete a desired action, such as a purchase","The exchange rate between currencies","The rate at which webpages load","The number of social media followers gained monthly"], correct:0 },
      { value:300, q:"Cost per acquisition (CPA) measures:",
        options:["The total ad spend regardless of results","The average cost to acquire one paying customer or lead","The number of impressions served","Website bounce rate"], correct:1 },
      { value:400, q:"Return on investment (ROI) in digital marketing is calculated as:",
        options:["Total impressions divided by clicks","Number of followers minus unfollows","(Net profit from investment / cost of investment) x 100","Website loading speed"], correct:2 },
      { value:500, q:"'Bounce rate' refers to:",
        options:["The number of times an ad is displayed","The average order value","The number of shares on social media","The percentage of visitors who leave a site after viewing only one page"], correct:3 }
    ]
  },
  {
    category: "Competitor Intelligence",
    questions: [
      { value:100, q:"Competitive intelligence primarily helps a company:",
        options:["Understand competitors' strategies, strengths, and weaknesses","Set employee salaries","File tax returns","Design office layouts"], correct:0 },
      { value:200, q:"A SWOT analysis examines:",
        options:["Sales, Wages, Overhead, Turnover","Strengths, Weaknesses, Opportunities, Threats","Supply, Warehousing, Operations, Transport","Segmentation, Website, Outreach, Targeting"], correct:1 },
      { value:300, q:"Benchmarking against competitors typically involves:",
        options:["Ignoring competitor performance entirely","Copying competitor logos","Comparing a company's practices/performance to industry best practices","Filing a lawsuit against rivals"], correct:2 },
      { value:400, q:"One ethical boundary of competitive intelligence gathering is that it should:",
        options:["Include corporate espionage if necessary","Never involve public information","Focus solely on rumors","Rely only on legal and ethical sources of information"], correct:3 },
      { value:500, q:"Monitoring customer reviews, industry reports, and competitor websites is an example of:",
        options:["Ongoing marketing/competitive intelligence gathering","Internal auditing","Product development","Legal compliance review"], correct:0 }
    ]
  }
];

let score = 0;
const usedSet = new Set();

function saveState(){
  // in-memory only, no persistence needed across reloads
}

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  DATA.forEach((cat) => {
    const header = document.createElement('div');
    header.className = 'cat-header';
    header.textContent = cat.category;
    board.appendChild(header);
  });
  DATA.forEach((cat, ci) => {
    cat.questions.forEach((q, qi) => {
      const key = ci + '-' + qi;
      const cell = document.createElement('div');
      cell.className = 'cell' + (usedSet.has(key) ? ' used' : '');
      cell.textContent = '$' + q.value;
      cell.dataset.key = key;
      if(!usedSet.has(key)){
        cell.addEventListener('click', () => openModal(ci, qi));
      }
      board.appendChild(cell);
    });
  });
  document.getElementById('scoreValue').textContent = (score < 0 ? '-$' + Math.abs(score) : '$' + score);
  document.getElementById('scoreboard').classList.toggle('negative', score < 0);
}
// Rebuild grid so headers row then 5 rows of cells align properly
function rebuildGrid(){
  const board = document.getElementById('board');
  board.style.gridTemplateRows = 'auto repeat(5, 1fr)';
  board.innerHTML = '';
  DATA.forEach((cat)=>{
    const header = document.createElement('div');
    header.className = 'cat-header';
    header.textContent = cat.category;
    board.appendChild(header);
  });
  for(let row=0; row<5; row++){
    DATA.forEach((cat, ci)=>{
      const q = cat.questions[row];
      const key = ci + '-' + row;
      const cell = document.createElement('div');
      cell.className = 'cell' + (usedSet.has(key) ? ' used' : '');
      cell.textContent = '$' + q.value;
      if(!usedSet.has(key)){
        cell.addEventListener('click', () => openModal(ci, row));
      }
      board.appendChild(cell);
    });
  }
  document.getElementById('scoreValue').textContent = (score < 0 ? '-$' + Math.abs(score) : '$' + score);
  document.getElementById('scoreboard').classList.toggle('negative', score < 0);
}

let currentKey = null;

function openModal(ci, qi){
  const cat = DATA[ci];
  const q = cat.questions[qi];
  currentKey = ci + '-' + qi;

  document.getElementById('modalCat').textContent = cat.category;
  document.getElementById('modalValue').textContent = '$' + q.value;
  document.getElementById('modalQuestion').textContent = q.q;
  document.getElementById('modalFeedback').textContent = '';
  document.getElementById('modalFeedback').className = 'feedback';
  document.getElementById('closeBtn').disabled = true;

  const choicesEl = document.getElementById('modalChoices');
  choicesEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.innerHTML = '<span class="letter">' + letters[idx] + '</span>' + opt;
    div.addEventListener('click', () => selectAnswer(idx, q, div, choicesEl));
    choicesEl.appendChild(div);
  });

  document.getElementById('overlay').classList.add('open');
}

function selectAnswer(idx, q, el, container){
  // lock all choices
  Array.from(container.children).forEach(c => c.classList.add('locked'));
  const feedback = document.getElementById('modalFeedback');

  if(idx === q.correct){
    el.classList.add('correct');
    score += q.value;
    feedback.textContent = 'Correct! +$' + q.value;
    feedback.className = 'feedback correct-text';
  } else {
    el.classList.add('wrong');
    Array.from(container.children)[q.correct].classList.add('correct');
    score -= q.value;
    feedback.textContent = 'Not quite. -$' + q.value;
    feedback.className = 'feedback wrong-text';
  }
  usedSet.add(currentKey);
  document.getElementById('closeBtn').disabled = false;
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
  rebuildGrid();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  score = 0;
  usedSet.clear();
  rebuildGrid();
});

rebuildGrid();
</script>

</body>
</html>
