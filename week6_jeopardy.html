<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Consumer Behavior & Product Life Cycle Jeopardy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --ink:#0B1F3D;
    --ink-2:#12294f;
    --paper:#F6F4EE;
    --gold:#D4AF37;
    --gold-dim:#a9872c;
    --teal:#2EC4B6;
    --coral:#FF6B6B;
    --grid-line: rgba(212,175,55,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      radial-gradient(ellipse at top, var(--ink-2), var(--ink) 70%);
    font-family: 'Trebuchet MS', 'Segoe UI', Helvetica, Arial, sans-serif;
    color: var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
  }
  header{
    text-align:center;
    margin-bottom: 22px;
  }
  .eyebrow{
    letter-spacing: 4px;
    font-size: 12px;
    color: var(--teal);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(26px, 4.6vw, 44px);
    margin: 0;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    letter-spacing: 1px;
  }
  .subtitle{
    margin-top: 8px;
    font-size: 14px;
    color: rgba(246,244,238,0.65);
  }

  .scoreboard{
    display:flex;
    gap:14px;
    align-items:center;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 999px;
    padding: 10px 22px;
    margin-bottom: 26px;
    font-variant-numeric: tabular-nums;
  }
  .scoreboard .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    color: rgba(246,244,238,0.6);
  }
  .scoreboard .value{
    font-size: 26px;
    font-weight:700;
    color: var(--gold);
    min-width: 70px;
    text-align:center;
  }
  .scoreboard.negative .value{ color: var(--coral); }

  .board{
    width: 100%;
    max-width: 1200px;
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    background: rgba(0,0,0,0.2);
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.25);
  }
  .cat-header{
    background: linear-gradient(180deg, #0f2a52, #0a1c3a);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 6px;
    padding: 14px 8px;
    text-align:center;
    font-weight:700;
    font-size: clamp(11px, 1.3vw, 14px);
    text-transform:uppercase;
    letter-spacing: 0.5px;
    color: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 68px;
    line-height:1.25;
  }
  .cell{
    background: linear-gradient(180deg, #123063, #0b1f3f);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 6px;
    padding: 18px 6px;
    text-align:center;
    font-family: Georgia, serif;
    font-weight:700;
    font-size: clamp(18px, 2.6vw, 26px);
    color: var(--gold);
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
    user-select:none;
  }
  .cell:hover:not(.used){
    transform: translateY(-2px);
    background: linear-gradient(180deg, #16407f, #0d234a);
  }
  .cell.used{
    color: rgba(212,175,55,0.22);
    cursor: default;
    background: rgba(0,0,0,0.25);
  }
  .cell.used::after{
    content: "✓";
    display:block;
    font-size: 14px;
    margin-top: 4px;
    color: rgba(46,196,182,0.4);
  }

  footer{
    margin-top: 34px;
    font-size: 12px;
    color: rgba(246,244,238,0.4);
    text-align:center;
  }

  /* Modal */
  .overlay{
    position: fixed; inset:0;
    background: rgba(4,10,22,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: linear-gradient(180deg, #123063, #0a1c3a);
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 12px;
    max-width: 720px;
    width:100%;
    padding: 34px 30px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align:center;
  }
  .modal .tag{
    color: var(--teal);
    font-size: 12px;
    text-transform:uppercase;
    letter-spacing:3px;
    font-weight:700;
    margin-bottom: 10px;
  }
  .modal .value-tag{
    color: var(--gold);
    font-size:14px;
    font-weight:700;
    margin-bottom: 18px;
  }
  .modal .question{
    font-family: Georgia, serif;
    font-size: clamp(18px, 2.6vw, 24px);
    line-height:1.45;
    margin-bottom: 26px;
    color: var(--paper);
  }
  .choices{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width:520px){ .choices{ grid-template-columns: 1fr; } }
  .choice{
    background: rgba(246,244,238,0.06);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 8px;
    padding: 14px 12px;
    color: var(--paper);
    font-size: 15px;
    text-align:left;
    cursor:pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .choice:hover:not(.locked){
    background: rgba(212,175,55,0.14);
    border-color: var(--gold);
  }
  .choice .letter{
    display:inline-block;
    width: 22px;
    height:22px;
    line-height:22px;
    border-radius:50%;
    background: rgba(212,175,55,0.25);
    color: var(--gold);
    font-weight:700;
    font-size: 12px;
    margin-right: 10px;
    text-align:center;
  }
  .choice.correct{
    background: rgba(46,196,182,0.22);
    border-color: var(--teal);
  }
  .choice.wrong{
    background: rgba(255,107,107,0.2);
    border-color: var(--coral);
  }
  .feedback{
    min-height: 22px;
    font-weight:700;
    margin-bottom: 14px;
  }
  .feedback.correct-text{ color: var(--teal); }
  .feedback.wrong-text{ color: var(--coral); }

  .close-btn{
    background: var(--gold);
    color: var(--ink);
    border:none;
    padding: 10px 26px;
    border-radius: 999px;
    font-weight:700;
    cursor:pointer;
    font-size:14px;
    letter-spacing: 0.5px;
  }
  .close-btn:hover{ background:#e8c765; }
  .close-btn:disabled{
    opacity: 0.35;
    cursor: not-allowed;
  }

  .reset-btn{
    margin-top: 4px;
    background: transparent;
    color: rgba(246,244,238,0.55);
    border: 1px solid rgba(246,244,238,0.25);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 12px;
    cursor:pointer;
  }
  .reset-btn:hover{
    color: var(--paper);
    border-color: var(--gold);
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Week 6 · Consumer Behavior and Product Life Cycle</div>
  <h1>Consumer Behavior Jeopardy</h1>
  <div class="subtitle">Buyer behavior, product life cycle stages, innovation, demand forecasting, and global life cycles</div>
</header>

<div class="scoreboard" id="scoreboard">
  <span class="label">Score</span>
  <span class="value" id="scoreValue">$0</span>
  <button class="reset-btn" id="resetBtn">Reset Game</button>
</div>

<div class="board" id="board"></div>

<footer>Click a dollar value to open the clue. Answers are locked in once selected.</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="tag" id="modalCat">Category</div>
    <div class="value-tag" id="modalValue">$100</div>
    <div class="question" id="modalQuestion">Question text</div>
    <div class="choices" id="modalChoices"></div>
    <div class="feedback" id="modalFeedback"></div>
    <button class="close-btn" id="closeBtn" disabled>Close</button>
  </div>
</div>

<script>
const DATA = [
  {
    category: "Consumer & Buyer Behavior",
    questions: [
      { value:100, q:"Consumer buyer behavior refers to:",
        options:["The buying behavior of final consumers who purchase goods and services for personal consumption","Only the behavior of retail store employees","A company's internal purchasing department","The process of manufacturing a product"], correct:0 },
      { value:200, q:"Which of the following is a cultural factor influencing consumer behavior?",
        options:["A person's age and life-cycle stage","Social class and subculture","Family purchasing roles only","A person's personality traits"], correct:1 },
      { value:300, q:"The consumer buying decision process typically begins with:",
        options:["Purchase decision","Post-purchase evaluation","Problem or need recognition","Information search"], correct:2 },
      { value:400, q:"Cognitive dissonance in consumer behavior refers to:",
        options:["The initial excitement felt before a purchase","A consumer's loyalty to a single brand","The process of comparing brands before buying","Post-purchase discomfort caused by doubt about whether the right choice was made"], correct:3 },
      { value:500, q:"Which of the following is a personal factor that influences buyer behavior?",
        options:["Age, occupation, and lifestyle","Reference groups","Culture and subculture","Social class"], correct:0 }
    ]
  },
  {
    category: "Product Life Cycle Stages",
    questions: [
      { value:100, q:"The four main stages of the product life cycle are:",
        options:["Research, testing, launch, and recall","Introduction, growth, maturity, and decline","Planning, budgeting, forecasting, and reporting","Awareness, interest, desire, and action"], correct:1 },
      { value:200, q:"During the introduction stage of the product life cycle, a company typically experiences:",
        options:["Peak profits","Declining sales and shrinking competition","Slow sales growth and low or negative profits due to high launch costs","Maximum market saturation"], correct:2 },
      { value:300, q:"The growth stage of the product life cycle is characterized by:",
        options:["Sales beginning to decline sharply","Products being discontinued","No new competitors entering the market","Rapid market acceptance and increasing profits"], correct:3 },
      { value:400, q:"In the maturity stage, sales growth typically:",
        options:["Slows down as the product has already been adopted by most potential buyers","Increases at its fastest rate","Has not yet started","Is impossible to measure"], correct:0 },
      { value:500, q:"In the decline stage of the product life cycle, a company might choose to:",
        options:["Launch the product for the very first time","Reduce marketing support, harvest the product, or drop it from the line","Ignore falling sales indefinitely","Always increase prices dramatically"], correct:1 }
    ]
  },
  {
    category: "Innovation & Life Cycle",
    questions: [
      { value:100, q:"Product innovation can extend or restart a product's life cycle by:",
        options:["Removing the product from all markets","Ignoring changing customer needs","Introducing new features, uses, or improvements that renew customer interest","Reducing product quality"], correct:2 },
      { value:200, q:"According to the diffusion of innovation concept, 'early adopters' are consumers who:",
        options:["Never purchase new products","Are the very last to try a new product","Only buy products after they become mainstream","Adopt new products relatively early, often serving as opinion leaders"], correct:3 },
      { value:300, q:"Style, fashion, and fad are all examples of:",
        options:["Different patterns a product life cycle can take","Types of pricing strategies","Distribution channel structures","Segmentation variables"], correct:0 },
      { value:400, q:"A 'fad' in the product life cycle is best described as a trend that:",
        options:["Grows slowly and steadily over many years","Is adopted quickly, generates high enthusiasm, then declines fast","Never experiences a decline","Applies only to industrial products"], correct:1 },
      { value:500, q:"Companies often manage innovation across the life cycle by:",
        options:["Launching only one product and never updating it","Avoiding any research and development spending","Continuously investing in R&D to introduce line extensions or next-generation products","Waiting until a product fully declines before considering changes"], correct:2 }
    ]
  },
  {
    category: "Demand Estimation & Forecasting",
    questions: [
      { value:100, q:"Estimating 'current market demand' involves determining:",
        options:["Only what demand will be ten years from now","A guess with no supporting data","Demand for a product that does not yet exist","The total volume of a product that would be bought by a defined customer group in a defined time period and market"], correct:3 },
      { value:200, q:"Forecasting future demand is important because it helps a company:",
        options:["Plan production, staffing, and marketing efforts based on anticipated sales","Avoid ever measuring current demand","Eliminate the need for a marketing plan","Guarantee that sales will never decline"], correct:0 },
      { value:300, q:"'What is said' as a method of gathering marketing research insight refers to:",
        options:["Observing consumer actions without asking questions","Directly asking consumers about their attitudes, intentions, or opinions","Reviewing historical sales records only","Measuring product returns"], correct:1 },
      { value:400, q:"'What is done' as a research approach refers to:",
        options:["Reviewing what consumers plan to do in the future","Analyzing competitor financial statements","Observing consumers' actual current behavior, such as through experiments or observation","Predicting long-term industry trends"], correct:2 },
      { value:500, q:"'What has been done' as a research approach refers to:",
        options:["Speculating about undefined future demand","Ignoring past sales entirely","Interviewing consumers about hypothetical future purchases","Examining historical records, such as past sales and buying behavior, to identify patterns"], correct:3 }
    ]
  },
  {
    category: "Global Product Life Cycle",
    questions: [
      { value:100, q:"The international product life cycle theory suggests that a product's life cycle can:",
        options:["Follow different stages or timing in different countries as it is introduced globally","Only ever occur in one country","Be identical in every market at the same time","Never apply to global markets"], correct:0 },
      { value:200, q:"A product might be in the 'decline' stage in one country while being in the:",
        options:["Same exact stage everywhere due to globalization","'Introduction' or 'growth' stage in another, less-developed or newly entered market","Only decline stage in every market simultaneously","Research and development stage forever"], correct:1 },
      { value:300, q:"One reason companies extend a product's life cycle globally is to:",
        options:["Avoid selling the product to any new customers","Immediately discontinue the product everywhere","Capture additional sales and profit in markets where the product is still in earlier life cycle stages","Reduce total company revenue"], correct:2 },
      { value:400, q:"Cultural and economic differences across countries can cause a global product's life cycle to:",
        options:["Be exactly the same length in every market","Never be affected by local factors","Only matter for digital products","Vary in length and shape depending on local adoption rates and conditions"], correct:3 },
      { value:500, q:"A company managing a global product life cycle strategy must consider:",
        options:["Local market readiness, competition, and consumer preferences when timing product launches","Only the company's home market conditions","Ignoring all foreign regulations","Using an identical marketing mix everywhere with no adaptation"], correct:0 }
    ]
  }
];

let score = 0;
const usedSet = new Set();
let currentKey = null;

function rebuildGrid(){
  const board = document.getElementById('board');
  board.style.gridTemplateRows = 'auto repeat(5, 1fr)';
  board.innerHTML = '';
  DATA.forEach((cat)=>{
    const header = document.createElement('div');
    header.className = 'cat-header';
    header.textContent = cat.category;
    board.appendChild(header);
  });
  for(let row=0; row<5; row++){
    DATA.forEach((cat, ci)=>{
      const q = cat.questions[row];
      const key = ci + '-' + row;
      const cell = document.createElement('div');
      cell.className = 'cell' + (usedSet.has(key) ? ' used' : '');
      cell.textContent = '$' + q.value;
      if(!usedSet.has(key)){
        cell.addEventListener('click', () => openModal(ci, row));
      }
      board.appendChild(cell);
    });
  }
  document.getElementById('scoreValue').textContent = (score < 0 ? '-$' + Math.abs(score) : '$' + score);
  document.getElementById('scoreboard').classList.toggle('negative', score < 0);
}

function openModal(ci, qi){
  const cat = DATA[ci];
  const q = cat.questions[qi];
  currentKey = ci + '-' + qi;

  document.getElementById('modalCat').textContent = cat.category;
  document.getElementById('modalValue').textContent = '$' + q.value;
  document.getElementById('modalQuestion').textContent = q.q;
  document.getElementById('modalFeedback').textContent = '';
  document.getElementById('modalFeedback').className = 'feedback';
  document.getElementById('closeBtn').disabled = true;

  const choicesEl = document.getElementById('modalChoices');
  choicesEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.innerHTML = '<span class="letter">' + letters[idx] + '</span>' + opt;
    div.addEventListener('click', () => selectAnswer(idx, q, div, choicesEl));
    choicesEl.appendChild(div);
  });

  document.getElementById('overlay').classList.add('open');
}

function selectAnswer(idx, q, el, container){
  Array.from(container.children).forEach(c => c.classList.add('locked'));
  const feedback = document.getElementById('modalFeedback');

  if(idx === q.correct){
    el.classList.add('correct');
    score += q.value;
    feedback.textContent = 'Correct! +$' + q.value;
    feedback.className = 'feedback correct-text';
  } else {
    el.classList.add('wrong');
    Array.from(container.children)[q.correct].classList.add('correct');
    score -= q.value;
    feedback.textContent = 'Not quite. -$' + q.value;
    feedback.className = 'feedback wrong-text';
  }
  usedSet.add(currentKey);
  document.getElementById('closeBtn').disabled = false;
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
  rebuildGrid();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  score = 0;
  usedSet.clear();
  rebuildGrid();
});

rebuildGrid();
</script>

</body>
</html>
